name: Portable win-x64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test NotifyIsland.Tests/NotifyIsland.Tests.csproj -c Release

  fsm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/test_overlay_states.py

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build NotifyIsland.Av.csproj -c Release

  publish:
    runs-on: windows-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet publish NotifyIsland.Av.csproj -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify UTF-8 in publish output
        # Catch stale 1.3.x loc/*.json artifacts or any other CP1251 / Latin-1
        # leak before the artifact ships. Fails the job on non-UTF-8 text.
        run: python tools/check_utf8.py publish/
      - uses: actions/upload-artifact@v4
        with:
          name: NotifyIsland-portable-win-x64
          path: publish/**
          if-no-files-found: error
